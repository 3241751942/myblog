<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的博客 | 个人主页</title>
    <!-- 使用现代、干净的字体系统 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 独立CSS文件 -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <a href="#"><i class="fas fa-code"></i> 林间博客</a>
        </div>
        <button class="menu-toggle" id="mobileMenuBtn" aria-label="菜单">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="#" class="nav-item active" data-nav="home">首页</a></li>
            <li><a href="#" class="nav-item" data-nav="tech">技术文章</a></li>
            <li><a href="#" class="nav-item" data-nav="dev">生活爱好</a></li>
            <li><a href="/public/practical" class="nav-item" data-nav="case">实战案例</a></li>
            <li><a href="#" class="nav-item" data-nav="about">关于我</a></li>
        </ul>
    </div>
</nav>

<main>
    <!-- 首页区域：展示关于我的详细信息（包含头像、姓名、电话、性别等） -->
    <section class="hero">
        <div class="container">
            <div class="profile-container">
                <!-- 头像区域 -->
                <div class="profile-avatar">
                    <div class="avatar-large">
                        <i class="fas fa-user-circle"></i>
                    </div>
                </div>

                <!-- 个人信息详情 -->
                <div class="profile-info">
                    <h1 class="profile-name">林川</h1>
                    <div class="profile-title">
                        <i class="fas fa-map-marker-alt"></i> 中国 · 上海
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-icon"><i class="fas fa-phone-alt"></i></div>
                            <div class="info-text">
                                <div class="info-label">联系电话</div>
                                <div class="info-value">+86 138 1234 5678</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fas fa-envelope"></i></div>
                            <div class="info-text">
                                <div class="info-label">电子邮箱</div>
                                <div class="info-value">linchuan@example.com</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fas fa-venus-mars"></i></div>
                            <div class="info-text">
                                <div class="info-label">性别</div>
                                <div class="info-value">男</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fas fa-calendar-alt"></i></div>
                            <div class="info-text">
                                <div class="info-label">出生日期</div>
                                <div class="info-value">1995年8月20日</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fas fa-briefcase"></i></div>
                            <div class="info-text">
                                <div class="info-label">职业 / 职位</div>
                                <div class="info-value">资深前端工程师 / 技术博主</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fas fa-globe"></i></div>
                            <div class="info-text">
                                <div class="info-label">个人网站</div>
                                <div class="info-value">linchuan.dev</div>
                            </div>
                        </div>
                    </div>

                    <div class="bio-text">
                        <i class="fas fa-quote-left" style="color: #2563eb; margin-right: 8px;"></i>
                        5年全栈开发经验，热爱技术分享与开源。专注前端工程化、跨端架构与性能优化。相信「最好的输入是输出」，希望通过博客记录思考，与开发者共同成长。
                    </div>

                    <div class="social-links">
                        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                        <a href="#" aria-label="掘金"><i class="fab fa-jsfiddle"></i></a>
                        <a href="#" aria-label="微信"><i class="fab fa-weixin"></i></a>
                        <a href="#" aria-label="领英"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2025 林间博客 | 保持好奇，持续输出 | 基于真实项目经验撰写</p>
    </div>
</footer>

<!-- 独立JavaScript文件 -->
<script th:src="@{/js/index.js}"></script>
</body>
</html>
